worker_processes auto;
error_log /tmp/adiyan_nginx_error.log warn;
pid /tmp/adiyan_nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /tmp/adiyan_nginx_access.log combined;

    # Upstream Adiyan server
    upstream adiyan_backend {
        server localhost:5001;
    }

    # HTTP server - redirect to HTTPS (optional)
    server {
        listen 8080;
        server_name localhost 127.0.0.1;

        # Webhook endpoint - forward to Adiyan
        location /webhook/openwa {
            proxy_pass http://adiyan_backend/webhook/openwa;
            proxy_set_header Host localhost:5001;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for long-running webhook processing
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://adiyan_backend/api/health;
            proxy_set_header Host localhost:5001;
        }

        # Catch-all - optional, for debugging
        location / {
            proxy_pass http://adiyan_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
