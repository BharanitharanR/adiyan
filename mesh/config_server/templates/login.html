<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Adiyan Config - Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
<style>
  body { display: flex; align-items: center; justify-content: center; height: 100vh; }
  .login-card { width: 340px; padding: 32px; text-align: center; }
  .login-card .logo { width: 56px; height: 56px; color: var(--accent); margin: 0 auto 14px; display: block; }
  .login-card h1 { font-size: 17px; margin: 0 0 4px; }
  .login-card .sub { color: var(--text-muted); font-size: 13px; margin: 0 0 22px; }
  .login-card button, .login-card input { width: 100%; margin-top: 10px; }
  .login-card input { text-align: center; letter-spacing: 0.3em; font-size: 18px; }
  .error { color: var(--danger); font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>
<div class="card login-card">
  <svg class="logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Adiyan logo"><circle cx="100" cy="100" r="88" fill="none" stroke="currentColor" stroke-width="8"/><text x="100" y="118" text-anchor="middle" font-family="'Courier New', 'SF Mono', monospace" font-weight="700" font-size="34" letter-spacing="1" fill="currentColor">ADiYAN</text></svg>
  <h1>Adiyan Config Dashboard</h1>
  <p class="sub">Owner login via WhatsApp code</p>

  <button id="send-btn" class="btn" onclick="requestOtp()" style="width:100%">Send login code to owner's WhatsApp</button>
  <div id="hint" class="hint"></div>

  <form method="post" action="/login" id="code-form" style="display:none">
    <input name="code" placeholder="0000" maxlength="4" inputmode="numeric" autofocus>
    <button type="submit" class="btn">Log in</button>
  </form>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <p class="hint" style="margin-top:20px">
    First time here, or switching to a different phone number?
    <a href="/register">Go straight to registration</a>
  </p>
</div>

<script>
async function requestOtp() {
  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  btn.textContent = 'Sending...';
  const res = await fetch('/login/request-otp', { method: 'POST' });
  const data = await res.json();
  if (data.ok) {
    document.getElementById('hint').textContent = "Code sent - check the owner's WhatsApp. Valid for 5 minutes.";
    document.getElementById('code-form').style.display = 'block';
    btn.style.display = 'none';
  } else {
    document.getElementById('hint').textContent = 'Could not send a code - is WhatsApp connected?';
    btn.disabled = false;
    btn.textContent = "Send login code to owner's WhatsApp";
  }
}
</script>
</body>
</html>
