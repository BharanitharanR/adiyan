<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Adiyan Config - Configs</title>
<link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
<style>
  .tabs {
    display: flex; gap: 4px; overflow-x: auto;
    border-bottom: 1px solid var(--border); margin-bottom: 22px;
  }
  .tab {
    padding: 10px 16px; font-size: 13px; font-weight: 500;
    color: var(--text-muted); cursor: pointer; white-space: nowrap;
    border-bottom: 2px solid transparent; background: none; border-left: none; border-right: none; border-top: none;
    font-family: inherit;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  .field-card { margin-bottom: 14px; }
  .field-row {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .field-row:last-child { border-bottom: none; }
  .field-label {
    width: 220px; flex-shrink: 0; padding-top: 6px;
    font-size: 12.5px; font-family: var(--font-mono); color: var(--text);
    word-break: break-word;
  }
  .field-type { display: block; color: var(--text-faint); font-size: 10.5px; text-transform: uppercase; margin-top: 2px; }
  .field-desc { display: block; color: var(--text-muted); font-size: 11.5px; font-family: var(--font); font-weight: 400; text-transform: none; margin-top: 5px; line-height: 1.4; }
  .field-control { flex: 1; min-width: 0; }
  .field-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; padding-top: 3px; }

  .stage-row { display: flex; gap: 8px; }
  .stage-row input { max-width: 140px; }
  .stage-row input.model-input { max-width: none; flex: 1; }

  .checkbox-row { display: flex; align-items: center; gap: 8px; padding-top: 4px; }
  .checkbox-row input { width: auto; }

  .array-editor .chip-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent-bg); color: var(--accent-hover);
    padding: 4px 6px 4px 10px; border-radius: 20px; font-size: 12px;
  }
  .chip button {
    background: none; border: none; color: var(--accent-hover); cursor: pointer;
    font-size: 14px; line-height: 1; padding: 0 2px;
  }
  .array-add-row { display: flex; gap: 6px; }
  .array-add-row input { flex: 1; }
  .array-empty { color: var(--text-faint); font-size: 12px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><span class="dot"></span> Adiyan</div>
  <nav>
    <a class="current" href="/configs">Configs</a>
    <a href="/agents-status">Agents online</a>
    <a class="logout" href="/logout">Log out</a>
  </nav>
</div>

<div class="page">
  <div class="page-header">
    <h1>Configs</h1>
    <p>One tab per agent - a new agent wired into config_sdk shows up here with no dashboard changes.</p>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="detail"><div class="empty">Loading...</div></div>
</div>

<script>
let allConfigs = {};
let selectedAgent = null;
// Client-side working copy of array-typed constants, keyed by "agent::key" -
// mutated by add/remove before a Save PUT, independent of allConfigs until saved.
let arrayDrafts = {};

async function load() {
  const res = await fetch('/api/agents');
  const data = await res.json();
  allConfigs = data.agents || {};
  const ids = Object.keys(allConfigs).sort();
  if (!selectedAgent && ids.length) selectedAgent = ids[0];
  renderTabs(ids);
  renderDetail();
}

function renderTabs(ids) {
  const el = document.getElementById('tabs');
  el.innerHTML = ids.map(id =>
    `<button class="tab ${id === selectedAgent ? 'active' : ''}" onclick="selectAgent('${id}')">${id}</button>`
  ).join('') || '<div class="empty">No agents configured yet</div>';
}

function selectAgent(id) {
  selectedAgent = id;
  renderTabs(Object.keys(allConfigs).sort());
  renderDetail();
}

function fieldDesc(text) {
  if (!text) return '';
  return `<span class="field-desc">${escapeHtml(text)}</span>`;
}

function fieldType(val) {
  if (typeof val === 'boolean') return 'bool';
  if (Array.isArray(val)) return 'array';
  if (typeof val === 'number') return Number.isInteger(val) ? 'int' : 'float';
  if (typeof val === 'string' && (val.length > 60 || val.includes('\n'))) return 'text-big';
  return 'text';
}

function renderDetail() {
  const cfg = allConfigs[selectedAgent];
  const el = document.getElementById('detail');
  if (!cfg) { el.innerHTML = '<div class="empty">Select an agent</div>'; return; }

  const descriptions = cfg.descriptions || {};
  let html = '';

  const stages = Object.entries(cfg.stages || {});
  if (stages.length) {
    html += '<div class="card card-pad field-card"><h3>Stages</h3>';
    for (const [stage, val] of stages) {
      html += `
        <div class="field-row">
          <div class="field-label">${stage}<span class="field-type">model / temperature / timeout</span>${fieldDesc(descriptions[stage])}</div>
          <div class="field-control">
            <div class="stage-row">
              <input class="model-input" id="model-${stage}" value="${escapeAttr(val.model || '')}" placeholder="model">
              <input type="number" step="0.1" min="0" max="2" id="temp-${stage}" value="${val.temperature ?? ''}" placeholder="temp">
              <input type="number" step="1" min="1" id="timeout-${stage}" value="${val.timeout ?? ''}" placeholder="timeout (s)">
            </div>
          </div>
          <div class="field-actions">
            <button class="btn btn-sm" onclick="saveStage('${stage}')">Save</button>
            <span class="saved-flash" id="saved-stage-${stage}"></span>
          </div>
        </div>`;
    }
    html += '</div>';
  }

  const constants = Object.entries(cfg.constants || {});
  if (constants.length) {
    html += '<div class="card card-pad field-card"><h3>Constants</h3>';
    for (const [key, val] of constants) {
      const type = fieldType(val);
      html += `
        <div class="field-row">
          <div class="field-label">${key}<span class="field-type">${type}</span>${fieldDesc(descriptions[key])}</div>
          <div class="field-control">${renderControl(key, val, type)}</div>
          <div class="field-actions">
            <button class="btn btn-sm" onclick="saveConstant('${key}')">Save</button>
            <span class="saved-flash" id="saved-const-${key}"></span>
          </div>
        </div>`;
    }
    html += '</div>';
  }

  el.innerHTML = html || '<div class="empty">This agent has no stages or constants on file yet</div>';
}

function renderControl(key, val, type) {
  const id = `const-${key}`;
  if (type === 'bool') {
    return `<div class="checkbox-row"><input type="checkbox" id="${id}" ${val ? 'checked' : ''}></div>`;
  }
  if (type === 'int') {
    return `<input type="number" step="1" id="${id}" value="${val}" oninput="validateInt(this)">`;
  }
  if (type === 'float') {
    return `<input type="number" step="any" id="${id}" value="${val}" oninput="validateFloat(this)">`;
  }
  if (type === 'text-big') {
    return `<textarea class="big" id="${id}">${escapeHtml(val)}</textarea>`;
  }
  if (type === 'array') {
    const draftKey = `${selectedAgent}::${key}`;
    if (!(draftKey in arrayDrafts)) arrayDrafts[draftKey] = [...val];
    return renderArrayEditor(draftKey);
  }
  return `<input type="text" id="${id}" value="${escapeAttr(val)}">`;
}

function renderArrayEditor(draftKey) {
  const items = arrayDrafts[draftKey] || [];
  const chips = items.map((item, i) =>
    `<span class="chip">${escapeHtml(item)}<button onclick="removeArrayItem('${draftKey}', ${i})">&times;</button></span>`
  ).join('');
  return `
    <div class="array-editor" data-draft-key="${draftKey}">
      <div class="chip-list">${chips || ''}</div>
      ${items.length ? '' : '<div class="array-empty">No items yet</div>'}
      <div class="array-add-row">
        <input type="text" id="add-${draftKey}" placeholder="Add an item...">
        <button class="btn btn-sm btn-ghost" onclick="addArrayItem('${draftKey}')">Add to list</button>
      </div>
    </div>`;
}

function addArrayItem(draftKey) {
  const input = document.getElementById(`add-${draftKey}`);
  const value = input.value.trim();
  if (!value) return;
  arrayDrafts[draftKey].push(value);
  rerenderArrayEditor(draftKey);
}

function removeArrayItem(draftKey, index) {
  arrayDrafts[draftKey].splice(index, 1);
  rerenderArrayEditor(draftKey);
}

function rerenderArrayEditor(draftKey) {
  const container = document.querySelector(`.array-editor[data-draft-key="${draftKey}"]`);
  if (container) container.outerHTML = renderArrayEditor(draftKey);
}

function validateInt(input) {
  const ok = /^-?\d+$/.test(input.value.trim());
  input.classList.toggle('invalid', !ok);
}

function validateFloat(input) {
  const ok = input.value.trim() !== '' && !isNaN(Number(input.value));
  input.classList.toggle('invalid', !ok);
}

function escapeHtml(str) {
  return String(str).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

function escapeAttr(str) {
  return escapeHtml(str).replace(/"/g, '&quot;');
}

async function saveStage(stage) {
  const model = document.getElementById(`model-${stage}`).value;
  const temperature = document.getElementById(`temp-${stage}`).value;
  const timeout = document.getElementById(`timeout-${stage}`).value;
  const res = await fetch(`/api/agents/${selectedAgent}/stages/${stage}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model, temperature, timeout }),
  });
  const data = await res.json();
  flashSaved(`saved-stage-${stage}`, data.updated, data.message);
  if (data.updated) await load();
}

async function saveConstant(key) {
  const cfg = allConfigs[selectedAgent];
  const currentVal = cfg.constants[key];
  const type = fieldType(currentVal);
  let value;

  if (type === 'bool') {
    value = document.getElementById(`const-${key}`).checked;
  } else if (type === 'int') {
    const raw = document.getElementById(`const-${key}`);
    if (!/^-?\d+$/.test(raw.value.trim())) { flashSaved(`saved-const-${key}`, false, 'not a whole number'); return; }
    value = parseInt(raw.value, 10);
  } else if (type === 'float') {
    const raw = document.getElementById(`const-${key}`);
    if (raw.value.trim() === '' || isNaN(Number(raw.value))) { flashSaved(`saved-const-${key}`, false, 'not a number'); return; }
    value = parseFloat(raw.value);
  } else if (type === 'array') {
    value = arrayDrafts[`${selectedAgent}::${key}`] || [];
  } else {
    value = document.getElementById(`const-${key}`).value;
  }

  const res = await fetch(`/api/agents/${selectedAgent}/constants/${key}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ value }),
  });
  const data = await res.json();
  flashSaved(`saved-const-${key}`, data.updated, data.message);
  if (data.updated) {
    delete arrayDrafts[`${selectedAgent}::${key}`];
    await load();
  }
}

function flashSaved(elId, ok, message) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.textContent = ok ? 'Saved' : (message || 'Failed');
  el.className = 'saved-flash ' + (ok ? 'ok' : 'err');
  setTimeout(() => { el.textContent = ''; }, ok ? 2000 : 4000);
}

load();
</script>
</body>
</html>
