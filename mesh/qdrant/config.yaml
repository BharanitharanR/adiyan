storage:
  # This file is regenerated by mesh/start_all.sh on every run, with the
  # actual current user's $HOME substituted in - Rust's config loader
  # doesn't do shell-style tilde expansion, so it needs a real absolute
  # path, not a value baked in for whoever happened to commit this file.
  # Confirmed live to matter: this used to be checked in as a literal
  # /Users/<one specific person>/.Adiyan/qdrant_storage, so qdrant failed
  # with "Permission denied" trying to create that exact path on every
  # other machine. This placeholder is only what's on disk before the
  # first run generates the real one.
  storage_path: REPLACED_AT_RUNTIME_BY_START_ALL_SH

service:
  http_port: 6339
  grpc_port: 6340
